<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forja 3D · Editor</title>
  <meta name="description" content="Editor 3D en el navegador con primitivas, vista sólida y alámbrica, y proyectos guardados en el navegador.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 10v12L16 29 4 22V10z' fill='none' stroke='%23f2a541' stroke-width='2.5'/%3E%3Cpath d='M4 10l12 7 12-7M16 17v12' fill='none' stroke='%23f2a541' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three/three.module.min.js",
      "three/addons/": "./lib/three/addons/",
      "three-mesh-bvh": "./lib/three-mesh-bvh/index.module.js",
      "three-bvh-csg": "./lib/three-bvh-csg/index.module.js"
    }
  }
  </script>
</head>
<body>

  <!-- ============ PANTALLA DE PROYECTOS ============ -->
  <section id="projects-screen" class="screen" hidden>
    <header class="projects-head">
      <div class="brand">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 3 28 10v12L16 29 4 22V10z"/><path d="M4 10l12 7 12-7M16 17v12"/></svg>
        <div>
          <h1>Forja 3D</h1>
          <p>Editor 3D en el navegador · tus modelos se guardan en este navegador</p>
        </div>
      </div>
      <div class="projects-actions">
        <button class="btn" id="btn-help-home" title="Guía de uso y ejemplos (?)">Ayuda y ejemplos</button>
        <button class="btn" id="btn-import-project" title="Importar un proyecto desde un archivo .json">Importar JSON</button>
        <button class="btn" id="btn-export-all" title="Descargar todos los proyectos en un único .json">Exportar todo</button>
        <button class="btn btn-primary" id="btn-new-project">+ Nuevo proyecto</button>
      </div>
    </header>
    <div id="projects-grid" class="projects-grid"></div>
    <p class="storage-info" id="storage-info"></p>
  </section>

  <!-- ============ EDITOR ============ -->
  <section id="editor-screen" class="screen" hidden>
    <header class="topbar">
      <button class="icon-btn" id="btn-back" title="Volver a proyectos">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <input id="project-name" class="project-name" spellcheck="false" aria-label="Nombre del proyecto">
      <span class="save-state" id="save-state">Guardado</span>

      <div class="topbar-group">
        <button class="icon-btn" id="btn-undo" title="Deshacer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="icon-btn" id="btn-redo" title="Rehacer (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      </div>

      <div class="seg" id="transform-mode" role="group" aria-label="Herramienta">
        <button data-mode="translate" class="active" title="Mover (W)">Mover</button>
        <button data-mode="rotate" title="Rotar (E)">Rotar</button>
        <button data-mode="scale" title="Escalar (R)">Escalar</button>
      </div>

      <div class="seg" id="view-mode" role="group" aria-label="Modo de visualización">
        <button data-view="solid" class="active" title="Sólido (Z alterna)">Sólido</button>
        <button data-view="wire" title="Alámbrico (Z alterna)">Wire</button>
      </div>

      <div class="topbar-group right">
        <label class="toggle" title="Ajuste a rejilla (G)"><input type="checkbox" id="chk-snap"><span>Snap</span></label>
        <label class="toggle" title="Mostrar rejilla"><input type="checkbox" id="chk-grid" checked><span>Rejilla</span></label>
        <button class="btn" id="btn-export" title="Descargar el proyecto como .json">Descargar JSON</button>
        <button class="icon-btn help-btn" id="btn-help" title="Ayuda y ejemplos (? o F1)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.9M12 17.2v.1"/></svg></button>
      </div>
    </header>

    <aside class="toolbar" id="primitives" aria-label="Primitivas"></aside>

    <main class="viewport" id="viewport">
      <div class="ops-bar" id="ops-bar" role="toolbar" aria-label="Operaciones">
        <button data-op="union" title="Unir: fusiona los objetos seleccionados en uno (A ∪ B)">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/><circle class="fill" cx="9" cy="12" r="6"/><circle class="fill" cx="15" cy="12" r="6"/></svg>Unir</button>
        <button data-op="subtract" title="Restar: quita al primer objeto seleccionado el volumen de los demás (A − B)">
          <svg viewBox="0 0 24 24"><path class="fill" d="M12 6.8A6 6 0 1 0 12 17.2 6 6 0 0 1 12 6.8z"/><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6" stroke-dasharray="2 2"/></svg>Restar</button>
        <button data-op="intersect" title="Intersecar: conserva solo el volumen común (A ∩ B)">
          <svg viewBox="0 0 24 24"><path class="fill" d="M12 6.8A6 6 0 0 0 12 17.2 6 6 0 0 0 12 6.8z"/><circle cx="9" cy="12" r="6" stroke-dasharray="2 2"/><circle cx="15" cy="12" r="6" stroke-dasharray="2 2"/></svg>Intersecar</button>
        <button data-op="split" title="Partir: corta un objeto con un Plano seleccionado o, si no hay plano, en horizontal por su centro">
          <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M2 12.5h20" stroke-dasharray="3 2"/></svg>Partir</button>
        <button data-op="explode" title="Separar: deshace una operación booleana y recupera sus piezas">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="8" rx="1"/><circle cx="16.5" cy="15" r="4.5"/><path d="M12 3l2 2M20 4l-2 2M3 19l3-2"/></svg>Separar</button>
        <span class="ops-sep"></span>
        <button data-op="drop" title="Apoyar en el suelo (y = 0)">
          <svg viewBox="0 0 24 24"><rect x="8" y="4" width="8" height="8" rx="1"/><path d="M12 13v4M9.5 15l2.5 2.5 2.5-2.5M3 20h18"/></svg>Al suelo</button>
      </div>

      <div class="cam-label" id="cam-label">Perspectiva</div>

      <div class="view-bar" id="view-bar" role="toolbar" aria-label="Vistas">
        <button data-cam="front" title="Alzado / vista frontal (1 · Mayús+1 posterior)">Alzado</button>
        <button data-cam="right" title="Perfil derecho / vista lateral (3)">Perfil D</button>
        <button data-cam="left" title="Perfil izquierdo (Mayús+3)">Perfil I</button>
        <button data-cam="top" title="Planta / vista superior (7 · Mayús+7 inferior)">Planta</button>
        <button data-cam="back" title="Vista posterior (Mayús+1)">Post.</button>
        <button data-cam="bottom" title="Vista inferior (Mayús+7)">Inf.</button>
        <button data-cam="persp" title="Perspectiva (0)">Persp</button>
        <span class="ops-sep"></span>
        <button id="btn-proj" title="Alternar ortográfica / perspectiva (5)">Orto</button>
        <button data-cam="focus" title="Encuadrar selección (F)">Encuadrar</button>
      </div>
      <div class="hint" id="hint">Añade una primitiva desde la barra izquierda · clic para seleccionar (Mayús+clic: varios) · W/E/R mover/rotar/escalar</div>
    </main>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-head">
          <h2>Escena</h2>
          <span class="count" id="obj-count">0</span>
        </div>
        <ul class="outliner" id="outliner"></ul>
        <div class="panel-actions">
          <button class="btn sm" id="btn-duplicate" title="Duplicar (Ctrl+D)">Duplicar</button>
          <button class="btn sm danger" id="btn-delete" title="Eliminar (Supr)">Eliminar</button>
        </div>
      </div>
      <div class="panel grow">
        <div class="panel-head"><h2>Propiedades</h2></div>
        <div id="props" class="props"><p class="empty">Nada seleccionado</p></div>
      </div>
    </aside>

    <footer class="statusbar" id="statusbar"></footer>
  </section>

  <input type="file" id="file-input" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
